<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Control Portofolio</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #38bdf8;
            --text: #f8fafc;
            --border: rgba(255, 255, 255, 0.1);
            --danger: #f43f5e;
            --success: #4ade80;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 2rem; }
        .container { max-width: 650px; margin: 0 auto; }
        h1 { margin-bottom: 1.5rem; color: var(--primary); text-align: center; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem; }
        .card h2 { margin-bottom: 1rem; font-size: 1.2rem; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: #94a3b8; }
        input, textarea { width: 100%; padding: 0.7rem; background: #0b1120; border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 0.95rem; }
        input:focus, textarea:focus { border-color: var(--primary); outline: none; }
        button { background: var(--primary); color: #000; font-weight: bold; padding: 0.8rem 1.5rem; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 1rem; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { margin-top: 0.8rem; font-size: 0.9rem; text-align: center; font-weight: 600; display: none; }
        .status.success { color: var(--success); }
        .status.error { color: var(--danger); }
    </style>
</head>
<body>

<div class="container">
    <h1>Dashboard Portofolio</h1>

    <!-- FORM INPUT RESUME -->
    <div class="card">
        <h2>Tambah Riwayat Resume</h2>
        <form id="form-resume">
            <div class="form-group">
                <label>Posisi / Jabatan</label>
                <input type="text" id="res-posisi" required placeholder="Contoh: Web Developer">
            </div>
            <div class="form-group">
                <label>Nama Perusahaan</label>
                <input type="text" id="res-perusahaan" required placeholder="Contoh: PT Tech Indonesia">
            </div>
            <div class="form-group">
                <label>Periode</label>
                <input type="text" id="res-periode" required placeholder="Contoh: 2022 - Sekarang">
            </div>
            <div class="form-group">
                <label>Deskripsi Pekerjaan</label>
                <textarea id="res-deskripsi" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label>Urutan Tampil (Angka)</label>
                <input type="number" id="res-urutan" value="1" required>
            </div>
            <button type="submit" id="btn-resume">Kirim ke Google Sheets</button>
            <div id="status-resume" class="status"></div>
        </form>
    </div>

    <!-- FORM INPUT PROJECT -->
    <div class="card">
        <h2>Tambah Project Baru</h2>
        <form id="form-project">
            <div class="form-group">
                <label>Judul Project</label>
                <input type="text" id="proj-judul" required placeholder="Contoh: Portfolio 3D">
            </div>
            <div class="form-group">
                <label>Kategori</label>
                <input type="text" id="proj-kategori" required placeholder="Contoh: Web 3D">
            </div>
            <div class="form-group">
                <label>Deskripsi Singkat</label>
                <textarea id="proj-deskripsi" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label>Tags Teknologi (pisahkan dengan koma)</label>
                <input type="text" id="proj-tags" placeholder="HTML, CSS, JS">
            </div>
            <div class="form-group">
                <label>Link Demo</label>
                <input type="url" id="proj-demo" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>Link GitHub</label>
                <input type="url" id="proj-github" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>Urutan Tampil (Angka)</label>
                <input type="number" id="proj-urutan" value="1" required>
            </div>
            <button type="submit" id="btn-project">Kirim ke Google Sheets</button>
            <div id="status-project" class="status"></div>
        </form>
    </div>
</div>

<script>
    // ⚠️ PASTIKAN URL SHEETBEST ANDA BENAR DI SINI ⚠️
    // Jika ada tab sheet spesifik, tambahkan /tabs/NAMA_TAB di belakang URL
    // Contoh: "https://sheet.best/api/sheets/xxxx-xxxx/tabs/Resume"
    const API_RESUME = "https://api.sheetbest.com/sheets/677180fe-0dac-46e1-8da4-fcbd00ae05b7";
    const API_PROJECTS = "PASANG_URL_SHEETBEST_TAB_PROJECTS_DISINI";

    // Fungsi Pengiriman Data
    async function sendData(url, payload, btnId, statusId, formId) {
        const btn = document.getElementById(btnId);
        const status = document.getElementById(statusId);
        
        btn.disabled = true;
        btn.innerText = "Mengirim...";
        status.style.display = 'none';

        try {
            // SheetBest memerlukan format array [] saat mengirim data POST
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify([payload]) // Mengirim array of object
            });

            if (response.ok) {
                status.className = "status success";
                status.innerText = "✅ Data berhasil tersimpan di Google Sheets!";
                document.getElementById(formId).reset();
            } else {
                throw new Error(`HTTP Error status: ${response.status}`);
            }
        } catch (error) {
            console.error("Gagal mengirim:", error);
            status.className = "status error";
            status.innerText = "❌ Gagal mengirim! Periksa URL API atau Koneksi Internet.";
        } finally {
            btn.disabled = false;
            btn.innerText = "Kirim ke Google Sheets";
            status.style.display = 'block';
        }
    }

    // Submit Resume Form
    document.getElementById('form-resume').addEventListener('submit', (e) => {
        e.preventDefault();
        const payload = {
            posisi: document.getElementById('res-posisi').value,
            perusahaan: document.getElementById('res-perusahaan').value,
            periode: document.getElementById('res-periode').value,
            deskripsi: document.getElementById('res-deskripsi').value,
            urutan: document.getElementById('res-urutan').value
        };
        sendData(API_RESUME, payload, 'btn-resume', 'status-resume', 'form-resume');
    });

    // Submit Project Form
    document.getElementById('form-project').addEventListener('submit', (e) => {
        e.preventDefault();
        const payload = {
            judul: document.getElementById('proj-judul').value,
            kategori: document.getElementById('proj-kategori').value,
            deskripsi: document.getElementById('proj-deskripsi').value,
            tags: document.getElementById('proj-tags').value,
            link_demo: document.getElementById('proj-demo').value,
            link_github: document.getElementById('proj-github').value,
            urutan: document.getElementById('proj-urutan').value
        };
        sendData(API_PROJECTS, payload, 'btn-project', 'status-project', 'form-project');
    });
</script>
</body>
</html>
